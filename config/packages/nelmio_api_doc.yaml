nelmio_api_doc:
    areas:
        path_patterns: # an array of regexps (document only routes under /api, except /api/doc)
            - ^/_
        name_patterns: # document only routes with a name of the form api_*
            - ^api\_
    documentation:
        info:
            title: API Skeleton
            description:
            version: 0.0.1
        security:
            - Bearer: []
            - CSRF: []
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                CSRF:
                    type: apiKey
                    in: header
                    name: X-CSRF-Token
                    description: CSRF Token
